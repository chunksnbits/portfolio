# Tests, builds and checks the portfolio on every push, and publishes main to GitHub Pages.
# see: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
#
# A push to main in the private variants repository starts it on main too, through that repository's Deploy workflow.
#
# Actions are pinned to a commit, since the build holds the key to the private variants repository.
# A run's log is public while the run lasts.
# clean-up.yml deletes it and the artifact once the run has finished.
#
# NOTE: the repository's Pages source must be set to "GitHub Actions", not the gh-pages branch.
# The github-pages environment must allow deploys from main.
name: Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Whether the key to the private variants repository is set. Forks and their pull requests don't have it.
      HAS_VARIANTS: ${{ secrets.VARIANTS_DEPLOY_KEY != '' }}
      DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The variants live in a private repository, so only their built pages go online.
      # The key is a read-only deploy key of that repository, and no step after this checkout can read it.
      - if: env.HAS_VARIANTS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chunksnbits/portfolio-variants
          ssh-key: ${{ secrets.VARIANTS_DEPLOY_KEY }}
          path: variants
          persist-credentials: false
      # From here on, the log shows each variant's folder name, company, role and posting as ***.
      # A company or role that the base pages also name stays readable, since *** in their lines would give it away.
      - if: env.HAS_VARIANTS == 'true'
        run: |
          for file in variants/*/variant.json; do
            echo "::add-mask::$(basename "$(dirname "$file")")"
            echo "::add-mask::$(jq -r .job "$file")"
            jq -r '.company, .role' "$file" | while IFS= read -r value; do
              grep -qiF -- "$value" portfolio.md portfolio.de.md cv.md cv.de.md || echo "::add-mask::$value"
            done
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
      # Builds dist/ and fails if the printed CV runs past two pages
      # or a color misses the WCAG AA contrast minimum.
      # This log is public, so variant folders and paths show as "…".
      - run: npm run check 2>&1 | sed -E -e 's#variants/[^/[:space:]]+#variants/…#g' -e 's#/portfolio/[a-z0-9-]+/#/portfolio/…/#g'
        # bash fails the step when npm run check fails, not only when sed does.
        shell: bash
      # Only a deploy needs the artifact. It holds the published variants' pages, which signed-in GitHub users could download.
      # It's packed like actions/upload-pages-artifact v5.0.0 packs it, without the list of every file that action logs.
      # That list showed each variant's fonts, and how many variants are online.
      - if: env.DEPLOY == 'true'
        run: tar --dereference --hard-dereference --directory dist -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github '--exclude=.[^/]*' .
      - if: env.DEPLOY == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
