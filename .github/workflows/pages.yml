# Tests, builds and checks the portfolio on every push, and publishes master to GitHub Pages.
# see: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
#
# NOTE: the repository's Pages source must be set to "GitHub Actions", not the gh-pages branch.
name: Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Whether the key to the private variants repository is set. Forks and their pull requests don't have it.
      HAS_VARIANTS: ${{ secrets.VARIANTS_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      # The variants live in a private repository, so only their built pages go online.
      # The key is a read-only deploy key of that repository.
      - if: env.HAS_VARIANTS == 'true'
        uses: actions/checkout@v7
        with:
          repository: chunksnbits/portfolio-variants
          ssh-key: ${{ secrets.VARIANTS_DEPLOY_KEY }}
          path: variants
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      # Builds dist/ and fails if the printed CV runs past two pages
      # or a color misses the WCAG AA contrast minimum.
      # This log is public, so variant folders and paths show as "…".
      - run: npm run check 2>&1 | sed -E -e 's#variants/[^/[:space:]]+#variants/…#g' -e 's#/portfolio/[a-z0-9-]+/#/portfolio/…/#g'
        # bash fails the step when npm run check fails, not only when sed does.
        shell: bash
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # The artifact holds the published variants' pages, and signed-in GitHub users can download it until it expires.
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
